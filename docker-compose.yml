services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - claims-postgres:/var/lib/postgresql/data

volumes:
  claims-postgres:
